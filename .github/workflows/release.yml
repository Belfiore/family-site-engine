# Makes a release when a version tag (v1.2.0) is pushed: runs every check, makes sure VERSION says the same
# version as the tag, and publishes a GitHub release with that version's notes from CHANGELOG.md.
#
# A release reaches no site by itself. Sites take it when channels.json points their channel at it
# (see docs/releasing.md), which notify-sites.yml then tells them about.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: The tag and VERSION agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::The tag says $tag but VERSION says $file. Fix VERSION, then tag again."
            exit 1
          fi

      - name: Notes from CHANGELOG.md
        run: |
          python3 - <<'PY'
          import os, re
          v = os.environ['GITHUB_REF_NAME'].lstrip('v')
          text = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^## ' + re.escape(v) + r'\b.*?$(.*?)(?=^## |\Z)', text, re.S | re.M)
          notes = m.group(1).strip() if m else 'See CHANGELOG.md.'
          open('release-notes.md', 'w', encoding='utf-8').write(notes + '\n')
          PY

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
