# The engine's own checks: the build, the data checker and the migration (Python), then the sample site in a
# browser (Playwright). Runs on every push and pull request; a release is only made from a commit that passed.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build, data checker and migration
        run: python3 tests/test_build.py

      - name: The Discovery Timeline
        run: python3 tests/test_discoveries.py

      - name: The automatic release
        run: python3 tests/test_autorelease.py

      - name: The sample site's data
        run: python3 build/validate.py --site sample

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: The sample site in a browser
        run: node tests/check-sample.js

      - name: The Discovery Timeline page in a browser
        run: node tests/check-timeline.js
