# Builds a family site with the engine, runs the site's own checks against the build, and publishes it to
# GitHub Pages. Each site calls this from its own deploy workflow (see docs/adding-a-site.md):
#
#   jobs:
#     site:
#       uses: Belfiore/family-site-engine/.github/workflows/build-site.yml@v1.0.0
#       with:
#         site-tests: |
#           node tests/verify-canvas.js
#
# The calling workflow grants what publishing needs: contents: read, pages: write, id-token: write and
# actions: read (deploy-pages looks up the uploaded site through the Actions API). A run that only checks
# (deploy: false) needs contents: read.
#
# Which engine is used: the version given for this run, else engine.version in site.config.json, else the
# version the site's channel (engine.channel) points to in channels.json on the engine's main branch.
# If the data check, the build or any of the site's checks fails, nothing is published and the live site
# stays as it was.
#
# A site that turns on private access (access.enabled in site.config.json) is published to Cloudflare Pages instead
# of GitHub Pages, behind a password gate (docs/access.md). The calling workflow then passes three secrets
# (secrets: inherit does it): SITE_PASSWORD, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. A site without it is
# published to GitHub Pages exactly as before and none of the steps for it run.
#
# A site that turns on the Discovery Timeline (pages.discoveries, or the older timeline.enabled, in site.config.json) also has the history of what
# was found fetched from its live site before the build, and written back with the new build. Other sites skip
# those steps.
name: Build and publish a family site

on:
  workflow_call:
    inputs:
      site-dir:
        description: The site's folder inside its repository (the folder with site.config.json).
        type: string
        default: '.'
      engine-version:
        description: Build with this engine version (1.2.0) instead of the site's channel, for a rollback or a trial.
        type: string
        default: ''
      site-tests:
        description: Commands that check the built site, one per line, run from the site folder (site-dir) with DIST set to the build.
        type: string
        default: ''
      deploy:
        description: Publish the build to GitHub Pages. False builds and checks only (for pull requests).
        type: boolean
        default: true
      engine-repo:
        description: Where the engine lives.
        type: string
        default: Belfiore/family-site-engine
    secrets:
      SITE_PASSWORD:
        description: The family password of a protected site (access.enabled). Becomes the SITE_PASSWORD secret of its Cloudflare Pages project.
        required: false
      CLOUDFLARE_API_TOKEN:
        description: A Cloudflare API token that can edit Cloudflare Pages. Only for a protected site.
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        description: The Cloudflare account that holds the Pages project. Only for a protected site.
        required: false
    outputs:
      engine-version:
        description: The engine version the site was built with.
        value: ${{ jobs.build.outputs.engine-version }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      engine-version: ${{ steps.engine.outputs.version }}
      protected: ${{ steps.engine.outputs.protected }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v5
        with:
          path: site

      - name: Read the engine's release channels
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.engine-repo }}
          ref: main
          path: engine-channels
          sparse-checkout: channels.json
          sparse-checkout-cone-mode: false

      - name: Choose the engine version
        id: engine
        env:
          PIN: ${{ inputs.engine-version }}
          SITE_DIR: site/${{ inputs.site-dir }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          pin = os.environ.get('PIN', '').strip().lstrip('v')
          with open(os.path.join(os.environ['SITE_DIR'], 'site.config.json'), encoding='utf-8') as f:
              eng = json.load(f).get('engine') or {}
          with open('engine-channels/channels.json', encoding='utf-8') as f:
              channels = json.load(f)['channels']
          if pin:
              v, why = pin, 'chosen for this run'
          elif eng.get('version'):
              v, why = str(eng['version']).lstrip('v'), 'pinned in site.config.json'
          else:
              ch = eng.get('channel') or 'stable'
              if ch not in channels:
                  sys.exit('site.config.json asks for the "%s" channel, which channels.json does not have (%s)' % (ch, ', '.join(channels)))
              v, why = channels[ch], 'the %s channel' % ch
          if not re.match(r'^\d+\.\d+\.\d+$', v):
              sys.exit('"%s" is not an engine version' % v)
          print('Engine %s (%s)' % (v, why))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('version=%s\n' % v)
              # the Discovery Timeline is on when pages.discoveries says so; if the site does not say, the older timeline.enabled does
              cfg = json.load(open(os.path.join(os.environ['SITE_DIR'], 'site.config.json'), encoding='utf-8'))
              d = (cfg.get('pages') if isinstance(cfg.get('pages'), dict) else {}).get('discoveries')
              if d is True or (not isinstance(d, bool) and (cfg.get('timeline') or {}).get('enabled') is True):
                  f.write('timeline=true\n')
              acc = json.load(open(os.path.join(os.environ['SITE_DIR'], 'site.config.json'), encoding='utf-8')).get('access') or {}
              if acc.get('enabled') is True:
                  proj = str(acc.get('project') or '')
                  if not re.match(r'^[a-z0-9]([a-z0-9-]{0,56}[a-z0-9])?$', proj):
                      sys.exit('access.project in site.config.json must name the Cloudflare Pages project (lower case letters, digits, hyphens)')
                  f.write('protected=true\nproject=%s\n' % proj)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f: f.write('Built with engine %s (%s).\n' % (v, why))
          PY

      - name: Check out the engine
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.engine-repo }}
          ref: v${{ steps.engine.outputs.version }}
          path: engine

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Only for a site with the Discovery Timeline on. The engine keeps nothing between builds, so what was
      # published last time is read from the live site. A publication that cannot read it stops here (a missing
      # history is not treated as an empty one); only a site that has never had the timeline starts fresh.
      - name: Fetch the previous discovery history
        if: steps.engine.outputs.timeline == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY: ${{ inputs.deploy }}
        run: |
          url=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .html_url 2>/dev/null || true)
          if [ -z "$url" ]; then
            if [ "$DEPLOY" = "true" ]; then
              echo "::error::Could not find this site's GitHub Pages address, so the previous discovery history cannot be read. Is Pages turned on, and does the calling workflow grant pages: write?"
              exit 1
            fi
            # a check-only run has less access; the usual address will do, as nothing is published from it
            url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          fi
          echo "Reading the previous history from $url"
          python3 engine/build/previous_site.py --url "$url" --out previous

      - name: Check the data and build the site
        run: python3 engine/build/build_site.py --site "site/${{ inputs.site-dir }}" --out _site ${{ steps.engine.outputs.timeline == 'true' && '--previous previous' || '' }}

      - name: Set up Node for the site's checks
        if: inputs.site-tests != '' || steps.engine.outputs.protected == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # at the top of the site's repository, so a check anywhere in it can load Playwright
      - name: Install Playwright
        if: inputs.site-tests != ''
        working-directory: site
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Check the built site
        if: inputs.site-tests != ''
        working-directory: site/${{ inputs.site-dir }}
        env:
          DIST: ${{ github.workspace }}/_site
          SITE_TESTS: ${{ inputs.site-tests }}
        run: |
          set -e
          while IFS= read -r cmd; do
            [ -z "${cmd// }" ] && continue
            echo "::group::$cmd"
            bash -c "$cmd"
            echo "::endgroup::"
          done <<< "$SITE_TESTS"

      - name: Set up Pages
        if: inputs.deploy && steps.engine.outputs.protected != 'true'
        uses: actions/configure-pages@v6

      - name: Upload the built site
        if: inputs.deploy && steps.engine.outputs.protected != 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # Only for a protected site (access.enabled). The password is put in the project's own secret store, then the
      # build is published. Cloudflare reads the secret when a deployment is made, so changing the password is
      # changing the GitHub secret and running this again; every device is then asked for the new one.
      - name: Publish to Cloudflare Pages
        id: cloudflare
        if: inputs.deploy && steps.engine.outputs.protected == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          PROJECT: ${{ steps.engine.outputs.project }}
        run: |
          set -euo pipefail
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SITE_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::error::The $v secret is not set, so a protected site cannot be published. See docs/access.md in the engine."
              exit 1
            fi
          done
          # the first publication makes the project; later ones find it there
          npx --yes wrangler@3 pages project create "$PROJECT" --production-branch main >/dev/null 2>&1 || echo "Project $PROJECT is already there."
          printf '%s' "$SITE_PASSWORD" | npx --yes wrangler@3 pages secret put SITE_PASSWORD --project-name "$PROJECT" >/dev/null
          npx --yes wrangler@3 pages deploy _site --project-name "$PROJECT" --branch main --commit-dirty=true 2>&1 | tee cloudflare-deploy.log
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' cloudflare-deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The gate must be what answers. If the worker were not picked up, Cloudflare would serve the files openly, so
      # this looks at the deployment as a stranger would and fails the run if anything comes back without the password.
      - name: Check the gate is closed
        if: inputs.deploy && steps.engine.outputs.protected == 'true'
        env:
          URL: ${{ steps.cloudflare.outputs.url }}
        run: |
          set -euo pipefail
          [ -n "$URL" ] || { echo "::error::Could not read the address Cloudflare published to."; exit 1; }
          bad=0
          for path in / /index.html /data/people.json /site-config.js; do
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$URL$path" || echo 000)
              [ "$code" = "401" ] && break
              sleep 10
            done
            echo "$path -> $code"
            [ "$code" = "401" ] || bad=1
          done
          gate=$(curl -s -D - -o /dev/null "$URL/" | tr -d '\r' | grep -i '^x-family-gate:' || true)
          [ -n "$gate" ] || { echo "No X-Family-Gate header: the gate is not what answered."; bad=1; }
          if [ "$bad" = "1" ]; then
            echo "::error::The published site answered without asking for the password. Treat it as open until this is fixed."
            exit 1
          fi
          echo "Published to $URL, and it asks for the password."

  deploy:
    if: inputs.deploy && needs.build.outputs.protected != 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
